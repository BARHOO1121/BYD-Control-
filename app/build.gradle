plugins {
    id 'com.android.application'
}

android {
    namespace 'com.carx.byd'
    compileSdk 35

    defaultConfig {
        applicationId 'com.carx.byd'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '1.0.1-alpha4.2'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    buildFeatures { buildConfig true }

    // Deliverables are aligned and signed separately; keep the original Car X storage requirements.
    androidResources { noCompress += ['arsc', 'dex'] }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}


dependencies {
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20231013'
}
