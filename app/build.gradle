plugins {
    id 'com.android.application'
}

android {
    namespace 'com.carx.byd'
    compileSdk 35

    defaultConfig {
        applicationId 'com.carx.byd'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '1.0.1-alpha4.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}


dependencies {
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
